{% extends 'diaryapp/base.html' %}

{% block title %}
Create Account - MyDiary
{% endblock %}


{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="logo">

            <span class="logo-icon">
                🚀
            </span>

            MyDiary

        </div>


        <br>


        <h1>
            Join MyDiary ✨
        </h1>

        <p>
            Start writing your story today.
        </p>


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}


            <button
                type="submit"
                class="btn"
                style="width:100%;"
            >
                Create Account
            </button>

        </form>


        <br>


        <p>
            Already have an account?

            <a
                href="{% url 'login' %}"
                style="color:#5b4bff;"
            >
                Login
            </a>
        </p>

    </div>

</div>

{% endblock %}
