{% extends 'diaryapp/base.html' %}

{% block content %}

<div class="card">

    <h1>Create Account</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have an account?

        <a href="{% url 'login' %}">
            Login
        </a>
    </p>

</div>

{% endblock %}
