{% extends 'diaryapp/base.html' %}

{% block content %}

<div class="card">

    <h1>{{ entry.title }}</h1>

    <p class="date">
        Created:
        {{ entry.created_at|date:"d M Y, h:i A" }}
    </p>

    <p>
        Updated:
        {{ entry.updated_at|date:"d M Y, h:i A" }}
    </p>

    <hr>

    <p>
        {{ entry.content|linebreaks }}
    </p>

    <a
        class="btn"
        href="{% url 'edit_entry' entry.id %}"
    >
        Edit
    </a>

    <a
        class="btn danger"
        href="{% url 'delete_entry' entry.id %}"
    >
        Delete
    </a>

</div>

{% endblock %}
