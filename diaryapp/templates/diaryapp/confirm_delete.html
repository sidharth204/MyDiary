{% extends 'diaryapp/base.html' %}

{% block title %}
Delete Entry - MyDiary
{% endblock %}


{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <h1>
            Delete Entry?
        </h1>

        <p>
            Are you sure you want to delete
            <strong>{{ entry.title }}</strong>?
        </p>


        <form method="POST">

            {% csrf_token %}

            <button
                type="submit"
                class="btn btn-danger"
            >
                Yes, Delete
            </button>


            <a
                href="{% url 'diary_detail' entry.id %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
