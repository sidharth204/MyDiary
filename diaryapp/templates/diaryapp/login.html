{% extends 'diaryapp/base.html' %}

{% block title %}
Login - MyDiary
{% endblock %}


{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="logo">
            <span class="logo-icon">
                🚀
            </span>

            MyDiary
        </div>


        <br>


        <h1>
            Welcome Back! 👋
        </h1>

        <p>
            Continue your diary journey.
        </p>


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}


            <button
                type="submit"
                class="btn"
                style="width:100%;"
            >
                Login
            </button>

        </form>


        <br>


        <p>
            Don't have an account?

            <a
                href="{% url 'register' %}"
                style="color:#5b4bff;"
            >
                Register
            </a>
        </p>

    </div>

</div>

{% endblock %}
